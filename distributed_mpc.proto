syntax = "proto3";

package distributed_mpc;

// 计算服务器服务 (Server-Client 模式)
service ComputeServer {
  // 注册参与方
  rpc RegisterParty(PartyRegistration) returns (RegistrationAck);

  // 链式密钥生成协议:
  // 1. Party 1 调用 InitKeyGen → 返回 CryptoContext 参数
  // 2. Party 1 本地 KeyGen() 后调用 SubmitKeyGenRound1 → 提交公钥+评估密钥
  // 3. Party 2 调用 GetPrevPublicKey → 获取前一轮公钥
  // 4. Party 2 本地 MultipartyKeyGen(prev_pk) 后调用 SubmitKeyGenRoundN → 提交联合公钥+评估密钥
  // 5. 重复直到所有参与方完成
  // 6. 任一方调用 GetJointPublicKey → 获取最终联合公钥

  // 初始化密钥生成（Party 1 调用）
  rpc InitKeyGen(InitKeyGenRequest) returns (InitKeyGenResponse);

  // 提交第一轮密钥生成结果（Party 1 调用）
  rpc SubmitKeyGenRound1(KeyGenRound1Submission) returns (KeyGenRoundAck);

  // 获取前一轮公钥（Party N > 1 调用，阻塞等待直到前一方提交）
  rpc GetPrevPublicKey(PrevPublicKeyRequest) returns (PrevPublicKeyResponse);

  // 提交第 N 轮密钥生成结果（Party N > 1 调用）
  rpc SubmitKeyGenRoundN(KeyGenRoundNSubmission) returns (KeyGenRoundAck);

  // 获取最终联合公钥和评估密钥（所有方调用，阻塞等待直到全部完成）
  rpc GetJointPublicKey(JointPublicKeyRequest) returns (JointPublicKeyResponse);

  // 接收加密数据 (流式)
  rpc SubmitCiphertext(stream CiphertextChunk) returns (SubmissionAck);

  // 获取计算结果 (流式)
  rpc GetResult(ResultRequest) returns (stream CiphertextChunk);

  // 触发计算
  rpc TriggerComputation(ComputationRequest) returns (ComputationStatus);

  // 查询状态
  rpc GetStatus(Empty) returns (ServerStatus);
}

// 参与方间 P2P 服务 (用于解密协作)
service PartyP2P {
  // 交换部分解密份额
  rpc ExchangePartialDecrypt(stream PartialDecryptChunk) returns (PartialDecryptAck);

  // 请求其他方的部分解密
  rpc RequestPartialDecrypt(PartialDecryptRequest) returns (stream PartialDecryptChunk);
}

// ==================== 消息定义 ====================

// 注册
message PartyRegistration {
  int32 party_id = 1;
  string party_name = 2;
  int32 party_p2p_port = 3;
}

message RegistrationAck {
  bool success = 1;
  string session_id = 2;
  int32 expected_parties = 3;
  repeated PartyInfo other_parties = 4;
  string error = 5;
}

message PartyInfo {
  int32 party_id = 1;
  string party_name = 2;
  string p2p_address = 3;
  int32 p2p_port = 4;
}

// 初始化密钥生成
message InitKeyGenRequest {
  int32 party_id = 1;
  string session_id = 2;
}

message InitKeyGenResponse {
  bool success = 1;
  string error = 2;
}

// 第一轮密钥生成提交 (Party 1)
message KeyGenRound1Submission {
  int32 party_id = 1;
  string session_id = 2;
  bytes public_key = 3;           // Party 1 的公钥
  bytes eval_mult_key = 4;       // 评估乘法密钥
  bytes eval_sum_keys = 5;       // 评估求和密钥
}

// 第 N 轮密钥生成提交 (Party N > 1)
message KeyGenRoundNSubmission {
  int32 party_id = 1;
  string session_id = 2;
  bytes joint_public_key = 3;     // 本轮生成的联合公钥 (MultipartyKeyGen 返回的)
  bytes eval_mult_key = 4;       // 本轮的评估乘法密钥
  bytes eval_sum_keys = 5;       // 本轮的评估求和密钥
  bytes eval_mult_final = 6;     // 聚合后的最终评估乘法密钥
  bytes eval_sum_final = 7;      // 聚合后的最终评估求和密钥
}

message KeyGenRoundAck {
  bool success = 1;
  int32 completed_rounds = 2;    // 已完成的轮次
  int32 expected_rounds = 3;     // 期望的轮次
  bool all_rounds_complete = 4;  // 所有轮次是否完成
  string error = 5;
}

// 获取前一轮公钥
message PrevPublicKeyRequest {
  int32 party_id = 1;
  string session_id = 2;
}

message PrevPublicKeyResponse {
  bool success = 1;
  bytes prev_public_key = 2;     // 前一轮的公钥
  int32 prev_party_id = 3;       // 前一个参与方 ID
  bytes eval_mult_key = 4;       // 前一轮聚合后的评估乘法密钥
  bytes eval_sum_keys = 5;       // 前一轮聚合后的评估求和密钥
  string error = 6;
}

// 获取联合公钥
message JointPublicKeyRequest {
  int32 party_id = 1;
  string session_id = 2;
}

message JointPublicKeyResponse {
  bool success = 1;
  bytes joint_public_key = 2;    // 最终联合公钥
  bytes eval_mult_key = 3;       // 最终聚合的评估乘法密钥
  bytes eval_sum_keys = 4;       // 最终聚合的评估求和密钥
  int32 party_count = 5;
  string error = 6;
}

// 密文传输
message CiphertextChunk {
  int32 party_id = 1;
  int32 chunk_index = 2;
  int32 total_chunks = 3;
  bytes data = 4;
  bool is_last = 5;
  string checksum = 6;
}

message SubmissionAck {
  bool success = 1;
  string submission_id = 2;
  string error = 3;
}

message ResultRequest {
  int32 party_id = 1;
  string submission_id = 2;
}

// 计算
message ComputationRequest {
  string computation_type = 1;
  map<string, string> params = 2;
}

message ComputationStatus {
  bool completed = 1;
  bool has_error = 2;
  string result_id = 3;
  string error = 4;
}

message ServerStatus {
  int32 connected_parties = 1;
  int32 total_parties = 2;
  string status = 3;
  int32 keygen_round = 4;         // 当前密钥生成轮次
  bool joint_key_ready = 5;
  int32 ciphertexts_received = 6;
}

// 部分解密
message PartialDecryptChunk {
  int32 from_party = 1;
  int32 to_party = 2;
  int32 chunk_index = 3;
  int32 total_chunks = 4;
  bytes data = 5;
  bool is_last = 6;
  string session_id = 7;
  string checksum = 8;
}

message PartialDecryptAck {
  bool success = 1;
  string error = 2;
}

message PartialDecryptRequest {
  int32 requesting_party = 1;
  string session_id = 2;
}

message Empty {}
